name: Publish index

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # weekly, so "trending" compares week to week
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py
      - name: Build index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Compare with the last weekly build only, so pushes in between don't reset "trending".
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/build_index.py --previous https://mawadao.github.io/registry/index.json --weekly
          else
            python scripts/build_index.py --previous https://mawadao.github.io/registry/index.json
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
