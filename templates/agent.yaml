# Copy this file to agents/<your-agent>.yaml (lowercase letters, digits and hyphens).
# Agents appear in the mawaDao marketplace once community review passes.
kind: agent
name: Reading Buddy
summary: Helps young pupils practise reading aloud, with gentle feedback in their own language.
category: education
tags: [literacy, primary]
links:
  repository: https://github.com/you/reading-buddy
license: Apache-2.0
# Agents must be free for education. Businesses can pay, which supports you as the developer.
pricing:
  education:
    price: free
    usage: Unlimited for schools, orphanages, educators and students.
  individuals:
    price: free
    usage: 20 sessions a month.
  business:
    price: paid
    amount: 10
    currency: USD
    period: month
    usage: Per organisation, unlimited sessions.
agent:
  runtime: mawadao-agent-gateway   # or mawadao-agent-core, or other
  audience: Primary pupils learning to read (ages 6–9)
  languages: [en, sw]
  data_collected: none
maintainer:
  name: Your Name
  github: your-github-username
added: 2026-10-07
# Don't add a "safety" section; community reviewers set it.
